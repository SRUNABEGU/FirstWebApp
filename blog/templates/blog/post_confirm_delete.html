{% extends 'catalog/base.html' %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Удалить статью?</h1>
</div>

<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <p>Вы уверены, что хотите удалить статью «{{ post.title }}»?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger">Да, удалить</button>
            <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
