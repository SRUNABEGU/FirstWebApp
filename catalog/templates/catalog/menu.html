<nav class="ms-5 d-flex align-items-center flex-grow-1 gap-2">
    <a class="p-2 btn btn-outline-primary {% if request.resolver_match.url_name == 'home' %}disabled{% endif %}"
       href="{% url 'catalog:home' %}">Каталог</a>
    <a class="p-2 btn btn-outline-primary {% if request.resolver_match.namespace == 'blog' %}disabled{% endif %}"
       href="{% url 'blog:post_list' %}">Блог</a>
    <a class="p-2 btn btn-outline-primary {% if request.resolver_match.url_name == 'contacts' %}disabled{% endif %}"
       href="{% url 'catalog:contacts' %}">Контакты</a>

    <div class="ms-auto">
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'users:logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-danger">
                Выйти ({{ user.email }})
            </button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Войти</a>
        {% endif %}
    </div>
</nav>
