{% extends 'catalog/base.html' %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Удалить «{{ object.name }}»?</h1>
</div>

<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-lg btn-outline-danger">Да, удалить</button>
            <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-lg btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
